name: Daily blog publisher

on:
  schedule:
    # Pakistan is UTC+5 year-round. 09:00 UTC is 2:00 PM PKT.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apex-daily-blog-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and publish daily blog post
        run: |
          PKT_DATE="$(TZ=Asia/Karachi date +%F)"
          env APEX_BLOG_PUBLISH_FROM="$PKT_DATE" APEX_BLOG_MAX_CATCHUP=1 npm run blog:generate-daily

      - name: Verify today's Pakistan-date post exists
        run: |
          PKT_DATE="$(TZ=Asia/Karachi date +%F)"
          if ! grep -q "date: '$PKT_DATE'" src/pages/blog/index.astro; then
            echo "Daily blog publisher failed: $PKT_DATE is missing from the blog index."
            exit 1
          fi

      - name: Validate site
        run: |
          npm run lint:slop
          npm run build

      - name: Commit and push if a post was published
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No blog changes to publish."
          else
            git config user.name "Apex Blog Publisher"
            git config user.email "actions@github.com"
            git add src/pages/blog public/images/blog
            git commit -m "Publish scheduled daily blog for $(TZ=Asia/Karachi date +%F)"
            git push
          fi

      - name: Wait for Railway deployment and verify the live post
        env:
          SITE_URL: https://apexpackagingsolutions.com
        run: |
          PKT_DATE="$(TZ=Asia/Karachi date +%F)"
          SLUG="$(node scripts/blog-slug-for-date.mjs "$PKT_DATE")"

          for attempt in $(seq 1 30); do
            LISTING="$(curl --fail --silent --show-error --location --max-time 20 "$SITE_URL/blog" || true)"
            ARTICLE_STATUS="$(curl --silent --location --max-time 20 --output /dev/null --write-out '%{http_code}' "$SITE_URL/blog/$SLUG" || true)"
            if printf '%s' "$LISTING" | grep -q "$PKT_DATE" &&
               printf '%s' "$LISTING" | grep -q "$SLUG" &&
               [ "$ARTICLE_STATUS" = "200" ]; then
              echo "Verified $PKT_DATE live at $SITE_URL/blog/$SLUG"
              exit 0
            fi
            echo "Deployment not ready (attempt $attempt/30, article HTTP $ARTICLE_STATUS)."
            sleep 20
          done

          echo "Railway deployment verification failed for $PKT_DATE and $SLUG."
          exit 1
